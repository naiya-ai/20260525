seed: 50
device: cuda
output_dir: outputs/conditional_vae_raw_transformer_diabetes

data:
  dataset_root: datasets/preprocessed/gaussian_quantile
  dataset_name: harmonized_knhanes_1998_2024
  require_complete_target: false
  source_groups:
    - questionnaire_without_disease
    - dietary
  target_group: diabetes

model:
  backbone: transformer
  prior_mode: separate
  latent_dim: 16
  d_model: 256
  dropout: 0.1
  activation: gelu
  batch_norm: false

  tokenizer:
    type: raw_embedding

  encoder:
    type: transformer
    n_layers: 4
    n_heads: 8
    dropout: 0.1
    activation: gelu
    norm_first: true

  prior:
    type: transformer
    n_layers: 4
    n_heads: 8
    dropout: 0.1
    activation: gelu
    norm_first: true

  decoder:
    type: transformer
    n_layers: 4
    n_heads: 8
    dropout: 0.1
    activation: gelu
    norm_first: true

train:
  batch_size: 1024
  steps: 10000
  learning_rate: 0.0001
  weight_decay: 0.0001
  beta: 0.003
  beta_warmup_start_step: 1000
  beta_warmup_steps: 2000
  gradient_clip_norm: 1.0
  num_workers: 0
  mixed_precision: false
  masked_target_dropout: 0.0
  source_mask_dropout: 0.0
  early_stopping:
    enabled: true
    patience_fraction: 0.1
    min_delta: 0.0

logging:
  log_every: 10
  validate_every: 10
  checkpoint_every: 1000
  save_best: true

seed: 52
device: cuda
output_dir: outputs/masked_autoencoder_source/wide

data:
  dataset_root: datasets/preprocessed/gaussian_quantile
  dataset_name: harmonized_knhanes_1998_2024
  source_groups:
    - questionnaire_without_disease
    - dietary

model:
  source_encoder:
    embedding_dim: 256
    hidden_layers:
      - 2048
      - 2048
    output_dim: 512
    aggregation: sum
  decoder_hidden_layers:
    - 1024
    - 1024
    - 512
    - 512
  dropout: 0.1
  activation: relu
  batch_norm: true

train:
  batch_size: 4096
  steps: 3000
  learning_rate: 0.0007
  weight_decay: 0.0001
  mask_probability: 0.3
  gradient_clip_norm: 1.0
  num_workers: 0
  mixed_precision: false

logging:
  log_every: 50
  validate_every: 100
  checkpoint_every: 1000
  save_best: true

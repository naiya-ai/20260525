seed: 42
device: cuda
output_dir: model_experiment/classification/models/mlp/width_256/rep_01

data:
  dataset_root: datasets/preprocessed/gaussian_quantile
  dataset_name: harmonized_knhanes_1998_2024_year_stratified_split
  source_groups:
    - questionnaire_without_disease
    - dietary
  split_group: questionnaire_without_disease
  target_disease: diabetes

model:
  hidden_layers:
    - 256
    - 256
  dropout: 0.1
  activation: relu
  batch_norm: true
  class_weight: balanced

train:
  batch_size: 1024
  steps: 10000
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  num_workers: 0
  mixed_precision: false
  early_stopping:
    enabled: false
    patience_fraction: 0.1
    min_delta: 0.0

logging:
  log_every: 50
  validate_every: 100
  checkpoint_every: 1000
  save_best: true

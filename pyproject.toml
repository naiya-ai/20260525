[project]
name = "tabular-cvae"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "matplotlib>=3.10.9",
    "numpy>=2.4.0",
    "optuna>=4.0.0",
    "pandas>=3.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.9.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
